<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6C4DFF" />
    <meta name="finance-base-url" content="__FINANCE_BASE_URL__" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Finance" />
    <title>%WEB_TITLE%</title>
    <link rel="manifest" href="__FINANCE_BASE_URL__/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="__FINANCE_BASE_URL__/icons/apple-touch-icon.png" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #f6f6fb;
      }

      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      input,
      textarea,
      select {
        font-size: 16px !important;
      }
    </style>
    <script>
      (() => {
        const baseMeta = document.querySelector('meta[name="finance-base-url"]');
        const rawBaseUrl = baseMeta?.content ?? '';
        const isDevelopment = rawBaseUrl.startsWith('__FINANCE_');
        const baseUrl = isDevelopment ? '' : rawBaseUrl;
        const basePath = baseUrl.replace(/\/$/, '');
        if (baseMeta) baseMeta.content = basePath;

        const manifest = document.querySelector('link[rel="manifest"]');
        const appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
        if (manifest) manifest.href = `${basePath}/manifest.webmanifest`;
        if (appleIcon) appleIcon.href = `${basePath}/icons/apple-touch-icon.png`;

        if (isDevelopment || !('serviceWorker' in navigator)) return;

        const workerUrl = new URL(`${basePath}/sw.js`, window.location.origin);

        navigator.serviceWorker
          .register(workerUrl.href, { scope: `${basePath}/` })
          .then((registration) => {
            if (window.crossOriginIsolated) return;
            const reloadForIsolation = () => window.location.reload();
            if (navigator.serviceWorker.controller) {
              reloadForIsolation();
              return;
            }
            navigator.serviceWorker.addEventListener('controllerchange', reloadForIsolation, {
              once: true,
            });
            registration.update().catch(() => {});
          })
          .catch(() => {
            document.documentElement.dataset.serviceWorker = 'unavailable';
          });
      })();
    </script>
  </head>
  <body>
    <noscript>Please enable JavaScript to use Finance. / 请启用 JavaScript 以使用 Finance。</noscript>
    <div id="root"></div>
  </body>
</html>
